{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{% static 'auth_app/css/style.css' %}?v=5" />
  <title>Landing</title>
</head>

<body class="landing_page_body">
  <h2>Welcome</h2>

  <div class="action_buttons">
    {% if user.is_authenticated %}
    <a href="{% url 'dashboard' %}" class="btn btn_neon">Dashboard</a>
    <a href="{% url 'logout' %}" class="btn btn_neon">Logout</a>
    {% else %}
    <a href="{% url 'login' %}" class="btn btn_neon">Sign In</a>
    <a href="{% url 'register' %}" class="btn btn_neon">Sign Up</a>
    {% endif %}
  </div>
</body>

</html>
